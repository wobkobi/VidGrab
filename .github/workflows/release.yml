# Publishes a release whenever a merge into main brings a manifest version that isn't released
# yet. Merges that leave the version alone (CI or docs only) stop after the first step, so only
# changes to the add-on or helper reach users. AMO refuses to sign a version twice, which is
# another reason a release needs a version bump.
#
# The add-on is listed on AMO: each version is submitted there for review and Firefox updates it
# from AMO once approved. The GitHub release carries the helpers. Submitting needs the AMO API
# key and secret (addons.mozilla.org > Developer Hub > Manage API Keys) in the WEB_EXT_API_KEY
# and WEB_EXT_API_SECRET repository secrets.
name: Release

on:
  push:
    branches: [main]
  # Run by hand from the Actions tab. A dry run tests, lints and builds on GitHub's runners
  # without submitting to AMO or publishing, since a listed submission can't be taken back.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Test and build only, without submitting or publishing
        type: boolean
        default: false

# Releases run one at a time, in merge order
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for an unreleased version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run of v$version: testing and building without submitting or publishing."
            echo "new=true" >> "$GITHUB_OUTPUT"
          elif gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released, nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version isn't released yet."
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.new == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - if: steps.version.outputs.new == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum

      - name: Test
        if: steps.version.outputs.new == 'true'
        run: |
          (cd helper && go test ./...)
          node --test extension/tests scripts/release-notes.test.mjs
          npx --yes web-ext@10.8.0 lint -s extension

      # Before the AMO submission, which can't be taken back, so a version with no CHANGELOG.md
      # section stops here. The notes cover every version since the latest release, so one that
      # never got released still gets described.
      - name: Write the release notes
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          since=$(gh release view --json tagName -q .tagName 2>/dev/null | sed 's/^v//')
          node scripts/release-notes.mjs "$VERSION" ${since:+--since "$since"} --out "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # Built before the AMO submission, which can't be taken back, so a failed build stops the
      # release first. windres embeds the Windows helper's icon and version details.
      - name: Build the helpers
        if: steps.version.outputs.new == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
          node scripts/build-helper.mjs
          mkdir -p release
          cp dist/vidgrab-* release/

      # --approval-timeout 0 returns once AMO has the version, without waiting for the review,
      # which can take days. Firefox picks the version up from AMO after it is approved. AMO
      # needs a licence on every listed version and categories on the add-on, which
      # amo-metadata.json supplies.
      - name: Submit the add-on to AMO (listed)
        if: steps.version.outputs.new == 'true' && !inputs.dry_run
        # web-ext reads WEB_EXT_API_KEY and WEB_EXT_API_SECRET from the environment itself
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::error::The WEB_EXT_API_KEY or WEB_EXT_API_SECRET secret is missing, so the add-on can't be submitted."
            exit 1
          fi
          npx --yes web-ext@10.8.0 sign -s extension --channel listed --approval-timeout 0 \
            --amo-metadata .github/amo-metadata.json --artifacts-dir "$RUNNER_TEMP/signed"

      - name: Build the add-on (dry run)
        if: steps.version.outputs.new == 'true' && inputs.dry_run
        run: npx --yes web-ext@10.8.0 build -s extension --artifacts-dir "$RUNNER_TEMP/built"

      # Installs from 2.4.x carry an update_url pointing at updates.json on the latest release.
      # This one sends them to AMO's copy, which has no update_url, so from then on they update
      # from AMO. AMO serves the latest approved version, so the link works for any release.
      - name: Write updates.json
        if: steps.version.outputs.new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const [version] = process.argv.slice(1);
            const update = {
              version,
              update_link: "https://addons.mozilla.org/firefox/downloads/latest/vidgrab/latest.xpi",
            };
            const manifest = { addons: { "yt-dl-firefox@local": { updates: [update] } } };
            require("fs").writeFileSync("release/updates.json", JSON.stringify(manifest, null, 2));
          ' "$VERSION"

      - name: Publish
        if: steps.version.outputs.new == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" release/* \
            --target "$GITHUB_SHA" --title "VidGrab $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
